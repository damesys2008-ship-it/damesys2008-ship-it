name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # tous les jours à minuit (UTC)
  workflow_dispatch: # lancement manuel depuis l'onglet Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Générer les SVG du serpent
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#B8941F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D4AF37&color_dots=#161b22,#3d3214,#6b5616,#a3821f,#D4AF37

      - name: Publier sur la branche "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
